<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day Count</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111111;
    --panel: #1a1a1a;
    --line: #2a2a2a;
    --text: #f2f2f2;
    --muted: #8a8a8a;
    --done: #0aa37f;
    --ahead: #d9a441;
    --accent: #e05a47;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Space Grotesk", system-ui, sans-serif;
    padding: 32px 16px 64px;
  }
  main { max-width: 760px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0; letter-spacing: -0.03em; line-height: 1; }
  h1 span { color: var(--accent); }
  .meta { color: var(--muted); font-size: 0.85rem; text-align: right; }
  .meta b { color: var(--text); font-weight: 600; }
  .legend { display: flex; gap: 18px; font-size: 0.8rem; color: var(--muted); margin-bottom: 14px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .row {
    display: grid;
    grid-template-columns: 3.2rem 1fr;
    gap: 14px;
    align-items: center;
    padding: 14px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .rank { font-family: "JetBrains Mono", monospace; color: var(--muted); font-size: 0.9rem; text-align: center; }
  .rank svg { width: 3.2rem; height: 3.2rem; display: block; }
  .row.p1 { border-color: #c9a227; }
  .row.p2 { border-color: #9aa3ad; }
  .row.p3 { border-color: #b0703a; }
  .namerow { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .name { font-weight: 600; font-size: 1.05rem; }
  .tot { font-family: "JetBrains Mono", monospace; font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
  .tot b { color: var(--text); font-size: 1rem; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .legend { margin-bottom: 0; }
  button.refresh {
    font: inherit; font-size: 0.85rem; font-weight: 600;
    color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 14px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
  }
  button.refresh:hover { border-color: var(--done); }
  button.refresh:disabled { opacity: 0.6; cursor: wait; }
  button.refresh svg { width: 14px; height: 14px; }
  button.refresh.spin svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bars { display: grid; gap: 6px; }
  .br { display: grid; grid-template-columns: 1fr 3rem; gap: 10px; align-items: center; }
  .track { height: 14px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; border-radius: 4px; }
  .fill.d { background: var(--done); }
  .fill.a { background: var(--ahead); }
  .v { font-family: "JetBrains Mono", monospace; font-size: 0.9rem; text-align: right; }
  .v.a { color: var(--muted); }
  .msg { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Day<span>.</span>Count</h1>
    <div class="meta" id="meta">Loading...</div>
  </header>
  <div class="toolbar">
    <div class="legend">
      <span><i style="background:var(--done)"></i>Days so far</span>
      <span><i style="background:var(--ahead)"></i>Booked ahead</span>
    </div>
    <button class="refresh" id="refresh" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      Refresh
    </button>
  </div>
  <section id="list"><div class="msg">Loading...</div></section>
</main>
<script>
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmtDate = iso => new Date(iso + "T00:00:00").toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "numeric" });

  function ago(iso) {
    const mins = Math.round((Date.now() - new Date(iso)) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + " min ago";
    const h = Math.round(mins / 60);
    return h < 48 ? h + " hr ago" : Math.round(h / 24) + " days ago";
  }

  // One trophy shape, three metals, so they always match.
  const METALS = {
    1: ["#fff3b0", "#f2c94c", "#a8770f"],
    2: ["#ffffff", "#c9d1d9", "#6e7781"],
    3: ["#ffd9b8", "#d08a4c", "#7a4318"],
  };
  function trophy(place) {
    const [hi, mid, lo] = METALS[place];
    const id = "g" + place;
    return `<svg viewBox="0 0 64 64" aria-label="Place ${place}">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${hi}"/><stop offset="0.45" stop-color="${mid}"/><stop offset="1" stop-color="${lo}"/>
      </linearGradient></defs>
      <path d="M18 12h28v4h8c0 9-5 15-12 16-2 4-5 6-8 7v6h6l2 6H22l2-6h6v-6c-3-1-6-3-8-7-7-1-12-7-12-16h8zm-4 8c1 4 3 7 5 8-1-3-1-5-1-8zm32 0c0 3 0 5-1 8 2-1 4-4 5-8z" fill="url(#${id})" stroke="${lo}" stroke-width="1.2" stroke-linejoin="round"/>
      <rect x="18" y="51" width="28" height="7" rx="1.5" fill="url(#${id})" stroke="${lo}" stroke-width="1.2"/>
    </svg>`;
  }

  function render(data) {
    document.getElementById("meta").innerHTML =
      `Since <b>${fmtDate(data.start_date)}</b><br>Updated ${ago(data.generated)}`;
    const rows = [...data.counts].sort((a, b) =>
      b.total - a.total || b.days_to_date - a.days_to_date || a.title.localeCompare(b.title));
    if (!rows.length) {
      document.getElementById("list").innerHTML = '<div class="msg">Nothing on the calendar yet.</div>';
      return;
    }
    const max = Math.max(1, ...rows.map(r => Math.max(r.days_to_date, r.days_booked_ahead)));
    const pct = n => n ? (n / max) * 100 : 0;
    document.getElementById("list").innerHTML = rows.map((r, i) => {
      const place = i + 1;
      const rank = place <= 3 ? trophy(place) : String(place).padStart(2, "0");
      return `
      <div class="row ${place <= 3 ? "p" + place : ""}">
        <div class="rank">${rank}</div>
        <div>
          <div class="namerow">
            <div class="name">${esc(r.title)}</div>
            <div class="tot"><b>${r.total}</b> total</div>
          </div>
          <div class="bars">
            <div class="br" title="Days so far">
              <div class="track"><div class="fill d" style="width:${pct(r.days_to_date)}%"></div></div>
              <div class="v">${r.days_to_date}</div>
            </div>
            <div class="br" title="Booked ahead">
              <div class="track"><div class="fill a" style="width:${pct(r.days_booked_ahead)}%"></div></div>
              <div class="v a">${r.days_booked_ahead}</div>
            </div>
          </div>
        </div>
      </div>`;
    }).join("");
  }

  const btn = document.getElementById("refresh");
  function load() {
    btn.disabled = true;
    btn.classList.add("spin");
    return fetch("counts.json?t=" + Date.now(), { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(() => {
        document.getElementById("meta").textContent = "";
        document.getElementById("list").innerHTML = '<div class="msg">No data yet. Run the workflow once to generate counts.json.</div>';
      })
      .finally(() => {
        setTimeout(() => { btn.disabled = false; btn.classList.remove("spin"); }, 400);
      });
  }
  btn.addEventListener("click", load);
  load();
</script>
</body>
</html>
