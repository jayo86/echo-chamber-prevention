<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo Chamber Prevention Count</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111111;
    --panel: #1a1a1a;
    --line: #2a2a2a;
    --text: #f2f2f2;
    --muted: #8a8a8a;
    --done: #0aa37f;
    --ahead: #d9a441;
    --accent: #e05a47;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Space Grotesk", system-ui, sans-serif;
    padding: 32px 16px 64px;
  }
  main { max-width: 760px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  h1 { font-size: clamp(1.6rem, 5vw, 2.4rem); margin: 0; letter-spacing: -0.03em; line-height: 1; }
  h1 span { color: var(--accent); }
  .meta { color: var(--muted); font-size: 0.85rem; text-align: right; }
  .meta b { color: var(--text); font-weight: 600; }
  .legend { display: flex; gap: 18px; font-size: 0.8rem; color: var(--muted); margin-bottom: 14px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .row {
    display: grid;
    grid-template-columns: 3.2rem 1fr;
    gap: 14px;
    align-items: center;
    padding: 14px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .rank { font-family: "JetBrains Mono", monospace; color: var(--muted); font-size: 0.9rem; text-align: center; }
  .rank svg { width: 3.2rem; height: 3.2rem; display: block; }
  .row.p1 { border-color: #c9a227; }
  .row.p2 { border-color: #9aa3ad; }
  .row.p3 { border-color: #b0703a; }
  .namerow { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .name { font-weight: 600; font-size: 1.05rem; }
  .tot { font-family: "JetBrains Mono", monospace; font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
  .tot b { color: var(--text); font-size: 1rem; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .legend { margin-bottom: 0; }
  button.refresh {
    font: inherit; font-size: 0.85rem; font-weight: 600;
    color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 14px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
  }
  button.refresh:hover { border-color: var(--done); }
  button.refresh:disabled { opacity: 0.6; cursor: wait; }
  button.refresh svg { width: 14px; height: 14px; }
  button.refresh.spin svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btns { display: flex; gap: 8px; }
  button.refresh.update { border-color: var(--done); }
  button.refresh.update:hover { background: #0aa37f22; }
  .status { min-height: 1.2em; font-size: 0.8rem; color: var(--muted); text-align: right; margin: -6px 0 12px; }
  .status.err { color: var(--accent); }
  .bars { display: grid; gap: 6px; }
  .br { display: grid; grid-template-columns: 1fr 3rem; gap: 10px; align-items: center; }
  .track { height: 14px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; border-radius: 4px; }
  .fill.d { background: var(--done); }
  .fill.a { background: var(--ahead); }
  .v { font-family: "JetBrains Mono", monospace; font-size: 0.9rem; text-align: right; }
  .v.a { color: var(--muted); }
  .msg { color: var(--muted); padding: 40px 0; text-align: center; }

  /* Click a card to open its details */
  .row { cursor: pointer; }
  .row:hover { background: #1f1f1f; }
  .row.open { cursor: default; background: var(--panel); }
  .chev { color: var(--muted); font-size: 0.75rem; margin-left: 6px; display: inline-block; transition: transform .15s; }
  .row.open .chev { transform: rotate(90deg); }
  .details { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 16px; cursor: default; }
  .details h4 { margin: 0 0 8px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: "JetBrains Mono", monospace; font-size: 0.78rem; padding: 4px 8px; border-radius: 6px; background: #0aa37f22; border: 1px solid #0aa37f55; }
  .chip.a { background: #d9a44122; border-color: #d9a44166; }
  .chip.plain { background: transparent; border-color: var(--line); font-family: inherit; }
  .chip .n { color: var(--muted); margin-left: 4px; }
  .chip button { all: unset; cursor: pointer; color: var(--accent); margin-left: 8px; font-weight: 700; }
  .none { color: var(--muted); font-size: 0.85rem; }
  .edit { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .edit select, .edit input {
    font: inherit; font-size: 0.85rem; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0;
  }
  .edit select { flex: 1 1 180px; }
  .edit input { flex: 0 1 130px; }
  .hint { font-size: 0.78rem; color: var(--muted); margin-top: 6px; }
  .hint.err { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Echo Chamber Prevention <span>Count</span></h1>
    <div class="meta" id="meta">Loading...</div>
  </header>
  <div class="toolbar">
    <div class="legend">
      <span><i style="background:var(--done)"></i>Days so far</span>
      <span><i style="background:var(--ahead)"></i>Booked ahead</span>
    </div>
    <button class="refresh update" id="refresh" type="button" title="Pull fresh numbers from the calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      Refresh count
    </button>
  </div>
  <div class="status" id="status"></div>
  <section id="list"><div class="msg">Loading...</div></section>
</main>
<script>
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmtDate = iso => new Date(iso + "T00:00:00").toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "numeric" });

  function ago(iso) {
    const mins = Math.round((Date.now() - new Date(iso)) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + " min ago";
    const h = Math.round(mins / 60);
    return h < 48 ? h + " hr ago" : Math.round(h / 24) + " days ago";
  }

  // One trophy shape, three metals, so they always match.
  const METALS = {
    1: ["#fff3b0", "#f2c94c", "#a8770f"],
    2: ["#ffffff", "#c9d1d9", "#6e7781"],
    3: ["#ffd9b8", "#d08a4c", "#7a4318"],
  };
  function trophy(place) {
    const [hi, mid, lo] = METALS[place];
    const id = "g" + place;
    return `<svg viewBox="0 0 64 64" aria-label="Place ${place}">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${hi}"/><stop offset="0.45" stop-color="${mid}"/><stop offset="1" stop-color="${lo}"/>
      </linearGradient></defs>
      <path d="M18 12h28v4h8c0 9-5 15-12 16-2 4-5 6-8 7v6h6l2 6H22l2-6h6v-6c-3-1-6-3-8-7-7-1-12-7-12-16h8zm-4 8c1 4 3 7 5 8-1-3-1-5-1-8zm32 0c0 3 0 5-1 8 2-1 4-4 5-8z" fill="url(#${id})" stroke="${lo}" stroke-width="1.2" stroke-linejoin="round"/>
      <rect x="18" y="51" width="28" height="7" rx="1.5" fill="url(#${id})" stroke="${lo}" stroke-width="1.2"/>
    </svg>`;
  }

  function render(data) {
    document.getElementById("meta").innerHTML =
      `Since <b>${fmtDate(data.start_date)}</b><br>Updated ${ago(data.generated)}`;
    const rows = [...data.counts].sort((a, b) =>
      b.total - a.total || b.days_to_date - a.days_to_date || a.title.localeCompare(b.title));
    if (!rows.length) {
      document.getElementById("list").innerHTML = '<div class="msg">Nothing on the calendar yet.</div>';
      return;
    }
    const max = Math.max(1, ...rows.map(r => Math.max(r.days_to_date, r.days_booked_ahead)));
    const pct = n => n ? (n / max) * 100 : 0;
    current = data;
    document.getElementById("list").innerHTML = rows.map((r, i) => {
      const place = i + 1;
      const rank = place <= 3 ? trophy(place) : String(place).padStart(2, "0");
      const isOpen = openCards.has(r.title);
      return `
      <div class="row ${place <= 3 ? "p" + place : ""} ${isOpen ? "open" : ""}" data-title="${esc(r.title)}">
        <div class="rank">${rank}</div>
        <div>
          <div class="namerow">
            <div class="name">${esc(r.title)}<span class="chev">&#9654;</span></div>
            <div class="tot"><b>${r.total}</b> total</div>
          </div>
          <div class="bars">
            <div class="br" title="Days so far">
              <div class="track"><div class="fill d" style="width:${pct(r.days_to_date)}%"></div></div>
              <div class="v">${r.days_to_date}</div>
            </div>
            <div class="br" title="Booked ahead">
              <div class="track"><div class="fill a" style="width:${pct(r.days_booked_ahead)}%"></div></div>
              <div class="v a">${r.days_booked_ahead}</div>
            </div>
          </div>
        </div>
        ${isOpen ? details(r, rows, data.today) : ""}
      </div>`;
    }).join("");
    document.querySelectorAll("[data-pin]").forEach(i => { i.value = savedPin(); });
  }

  // ---- Card details ----
  let current = null;
  const openCards = new Set();
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  // ["2026-08-03","2026-08-04","2026-08-05","2026-09-01"] -> ["3–5 Aug", "1 Sep"]
  function ranges(dates, today) {
    const thisYear = (today || "").slice(0, 4);
    const fmt = (iso, withMonth = true) => {
      const [y, m, d] = iso.split("-");
      return `${+d}${withMonth ? " " + MONTHS[+m - 1] : ""}${withMonth && y !== thisYear ? " " + y : ""}`;
    };
    const next = iso => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + 1); return d.toISOString().slice(0, 10); };
    const out = [];
    let start = null, prev = null;
    for (const d of [...dates, null]) {
      if (start && d === next(prev)) { prev = d; continue; }
      if (start) {
        if (start === prev) out.push(fmt(start));
        else if (start.slice(0, 7) === prev.slice(0, 7)) out.push(`${fmt(start, false)}–${fmt(prev)}`);
        else out.push(`${fmt(start)} – ${fmt(prev)}`);
      }
      start = prev = d;
    }
    return out;
  }

  function details(r, rows, today) {
    const chips = (dates, cls) => {
      const rs = ranges(dates, today);
      return rs.length ? `<div class="chips">${rs.map(x => `<span class="chip ${cls}">${x}</span>`).join("")}</div>` : `<div class="none">None</div>`;
    };
    const spellings = r.spellings.map(s => `<span class="chip plain">${esc(s.spelling)}<span class="n">&times;${s.events}</span></span>`).join("");
    const merged = (r.merged || []).length
      ? `<div class="chips">${r.merged.map(m => `<span class="chip plain">${esc(m)}<button type="button" data-unmerge="${esc(m)}" title="Count it separately again">Undo</button></span>`).join("")}</div>`
      : `<div class="none">Nothing merged in by hand.</div>`;
    const others = rows.filter(o => o.title !== r.title).map(o => o.title).sort((a, b) => a.localeCompare(b));
    return `
      <div class="details">
        <div><h4>Days so far (${r.days_to_date})</h4>${chips(r.dates_to_date, "")}</div>
        <div><h4>Booked ahead (${r.days_booked_ahead})</h4>${chips(r.dates_ahead, "a")}</div>
        <div><h4>Spelled on the calendar as</h4><div class="chips">${spellings}</div>
          <div class="hint">Differences in apostrophes, capitals and a trailing "?" are merged automatically.</div></div>
        <div><h4>Merged in by hand</h4>${merged}</div>
        <div><h4>Count ${esc(r.title)} as someone else</h4>
          <div class="edit">
            <select data-merge-to><option value="">Pick a name...</option>${others.map(o => `<option>${esc(o)}</option>`).join("")}</select>
            <input type="password" placeholder="Edit PIN" data-pin autocomplete="off">
            <button type="button" class="refresh" data-merge>Merge</button>
          </div>
          <div class="hint" data-msg>Their days get added to that person (shared days only count once). You can undo it from that person's card.</div>
        </div>
      </div>`;
  }

  function savedPin() { try { return sessionStorage.getItem("ecpc-pin") || ""; } catch (e) { return ""; } }
  function rememberPin(p) { try { sessionStorage.setItem("ecpc-pin", p); } catch (e) {} }

  async function edit(path, body, msgEl, button) {
    if (!body.pin) { msgEl.textContent = "Enter the edit PIN first."; msgEl.classList.add("err"); return; }
    button.disabled = true;
    msgEl.classList.remove("err");
    msgEl.textContent = "Saving...";
    try {
      const res = await fetch(WORKER_URL + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      rememberPin(body.pin);
      if (path === "/merge") { openCards.delete(body.from); openCards.add(body.to); }
      else openCards.add(body.from);
      render(data);
      say(path === "/merge" ? `Merged "${body.from}" into "${body.to}".` : `"${body.from}" is counted separately again.`);
      document.querySelector(`.row[data-title="${CSS.escape(path === "/merge" ? body.to : body.from)}"]`)?.scrollIntoView({ block: "nearest", behavior: "smooth" });
    } catch (e) {
      msgEl.textContent = e.message || "Something went wrong.";
      msgEl.classList.add("err");
      button.disabled = false;
    }
  }

  document.getElementById("list").addEventListener("click", e => {
    const row = e.target.closest(".row");
    if (!row) return;
    const title = row.dataset.title;

    const unmergeBtn = e.target.closest("[data-unmerge]");
    if (unmergeBtn) {
      const pin = row.querySelector("[data-pin]").value || savedPin();
      return edit("/unmerge", { from: unmergeBtn.dataset.unmerge, pin }, row.querySelector("[data-msg]"), unmergeBtn);
    }
    const mergeBtn = e.target.closest("[data-merge]");
    if (mergeBtn) {
      const to = row.querySelector("[data-merge-to]").value;
      const msgEl = row.querySelector("[data-msg]");
      if (!to) { msgEl.textContent = "Pick who to count them as."; msgEl.classList.add("err"); return; }
      const pin = row.querySelector("[data-pin]").value || savedPin();
      return edit("/merge", { from: title, to, pin }, msgEl, mergeBtn);
    }
    if (e.target.closest(".details")) return; // clicks inside the open panel don't close it

    openCards.has(title) ? openCards.delete(title) : openCards.add(title);
    render(current);
    const pinInput = document.querySelector(`.row[data-title="${CSS.escape(title)}"] [data-pin]`);
    if (pinInput) pinInput.value = savedPin();
  });

  // ---- Data comes straight from the Worker, which pulls from TimeTree ----
  const WORKER_URL = "https://echo-chamber.tamandjoel.workers.dev";
  const btn = document.getElementById("refresh");
  const statusEl = document.getElementById("status");
  const say = (msg, err) => { statusEl.textContent = msg || ""; statusEl.classList.toggle("err", !!err); };
  let haveData = false;

  async function get(fresh) {
    btn.disabled = true;
    btn.classList.add("spin");
    if (fresh) say("Pulling from the calendar...");
    try {
      const res = await fetch(WORKER_URL + (fresh ? "/refresh" : "/counts"), { method: fresh ? "POST" : "GET", cache: "no-store" });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      render(data);
      haveData = true;
      if (data.warning) say("Couldn't reach the calendar, showing the last numbers. (" + data.warning + ")", true);
      else if (data.note) say(data.note);
      else say(fresh ? "Updated just now." : "");
    } catch (e) {
      say(e.message || "Something went wrong.", true);
      if (!haveData) {
        document.getElementById("meta").textContent = "";
        document.getElementById("list").innerHTML = '<div class="msg">Couldn\'t load the counts right now. Try Refresh count in a moment.</div>';
      }
    } finally {
      setTimeout(() => { btn.disabled = false; btn.classList.remove("spin"); }, 300);
    }
  }

  btn.addEventListener("click", () => get(true));
  get(false);
</script>
</body>
</html>
